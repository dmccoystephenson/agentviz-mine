# build-kit.sh settings for the mine scene (sourced by scene/build.sh).
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="$here/../web"
KIT_NAME=mine-engine
KIT_EXPORT_NAME=createMine
KIT_EXPORTS=_mn_set_world,_mn_set_places,_mn_set_sessions,_mn_set_followers
KIT_WORK="$here/../.strata/work"
